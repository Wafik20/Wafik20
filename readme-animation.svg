<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="150" viewBox="0 0 1100 150" role="img" aria-label="Animated likes and dislikes">
<style>
text{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:17px;font-weight:600} .likes{animation:like 12s infinite}.hates{animation:hate 12s infinite;opacity:0}@keyframes like{0%,43%{opacity:1}49%,100%{opacity:0}}@keyframes hate{0%,49%{opacity:0}54%,94%{opacity:1}100%{opacity:0}}.spark{transform-box:fill-box;transform-origin:center;animation:pop 12s infinite;opacity:0}@keyframes pop{0%,8%,38%,48%,100%{opacity:0;transform:scale(.2)}14%,24%,33%{opacity:1;transform:scale(1.2)}}.shake{animation:shake 12s infinite}@keyframes shake{0%,54%,94%,100%{transform:translateX(0)}60%,66%,72%,78%,84%,90%{transform:translateX(-3px)}63%,69%,75%,81%,87%{transform:translateX(3px)}}
</style>
<rect width="1100" height="150" rx="16" fill="#0d1117"/>
<g class="likes">
<text x="550" y="66" text-anchor="middle"><tspan fill="#ff7675">I like </tspan><tspan fill="#ffb86c">distributed training</tspan><tspan fill="#c9d1d9">, </tspan><tspan fill="#f1fa8c">optimization</tspan><tspan fill="#c9d1d9">, </tspan><tspan fill="#50fa7b">reinforcement learning</tspan><tspan fill="#c9d1d9">, </tspan><tspan fill="#bd93f9">deep learning.</tspan></text>
<g fill="none" stroke-width="3" stroke-linecap="round"><g class="spark" stroke="#ffb86c"><path d="M115 35v-14m0 28v14m-14-28H87m28 0h14m-24-10-9-9m29 29 9 9m-29 0-9 9m29-29 9-9"/></g><g class="spark" stroke="#50fa7b"><path d="M970 100v-14m0 28v14m-14-28h-14m28 0h14m-24-10-9-9m29 29 9 9m-29 0-9 9m29-29 9-9"/></g><g class="spark" stroke="#ff79c6"><path d="M550 115v-12m0 24v12m-12-24h-12m24 0h12m-20-8-8-8m24 24 8 8m-24 0-8 8m24-24 8-8"/></g></g>
</g>
<g class="hates shake">
<text x="550" y="66" text-anchor="middle"><tspan fill="#ff5555">I hate </tspan><tspan fill="#ff6b6b">prompting LLMs</tspan><tspan fill="#c9d1d9">, </tspan><tspan fill="#ff9f43">writing requirements docs</tspan><tspan fill="#c9d1d9">,</tspan></text>
<text x="550" y="96" text-anchor="middle"><tspan fill="#e056fd">cleaning data</tspan><tspan fill="#c9d1d9">, </tspan><tspan fill="#ff4757">writing training pipelines.</tspan></text>
<text x="550" y="130" text-anchor="middle" font-size="23">💀 💥 💀</text>
</g>
</svg>
